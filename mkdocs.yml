site_name: GA4GH ServiceInfo SERVICE
site_description: Reusable SERVICE service for standardizing GA4GH ServiceInfo metadata.
site_author: GA4GH
site_url: https://ga4gh.github.io/ga4gh_service_info_sidecar_gsoc_2026/

repo_name: ga4gh/ga4gh_service_info_sidecar_gsoc_2026
repo_url: https://github.com/ga4gh/ga4gh_service_info_sidecar_gsoc_2026
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - User Guide:
    - Quick Start: quickstart.md
    - Configuration Reference: configuration.md
    - API Reference: api.md
  - Developer Guide:
    - Architecture: architecture.md
    - Development Setup: development.md