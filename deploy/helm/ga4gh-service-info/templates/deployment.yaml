apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ga4gh-service-info.fullname" . }}
  labels:
    {{- include "ga4gh-service-info.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ga4gh-service-info.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ga4gh-service-info.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: service-info
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        {{- if .Values.metricsService.enabled }}
        - name: metrics
          containerPort: 9090
        {{- end }}
        env:
        - name: SERVICE_CONFIG_PATH
          value: /etc/service-info/service_info.yaml
        volumeMounts:
        - name: config-volume
          mountPath: /etc/service-info
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "ga4gh-service-info.fullname" . }}-config
