apiVersion: v1
kind: Service
metadata:
  name: {{ include "ga4gh-service-info.fullname" . }}
  labels:
    {{- include "ga4gh-service-info.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ga4gh-service-info.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  {{- if .Values.metricsService.enabled }}
  - name: metrics
    port: {{ .Values.metricsService.port }}
    targetPort: metrics
    protocol: TCP
  {{- end }}
